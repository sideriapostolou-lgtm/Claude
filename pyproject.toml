[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nightcrawler"
dynamic = ["version"]
description = "Honest, provable Solana memecoin paper/live trading bot: multi-source crawler, rug filter, sell radar, AI judge, hash-chained receipts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
# Real-money execution (transaction signing). Paper mode does not need it.
live = ["solders>=0.29"]  # 0.29 adds MessageV1: Solana transaction v1, live since 2026-09-15
# The "Jev" AI judge (Anthropic API).
judge = ["anthropic>=1.0"]
# Tests: anthropic and solders are needed so test_judge.py / test_broker_live.py
# actually run instead of skipping; mypy for test_typecheck.py.
dev = ["pytest>=8", "anthropic>=1.0", "solders>=0.29", "mypy>=2.4"]

[project.scripts]
nightcrawler = "nightcrawler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The learning loop's first-boot variants (docs/LEARNING.md §11).
"nightcrawler.learn" = ["seeds.json"]
# The playbook registry, generated from docs/EXPERIENCE_GROUNDED.md (docs/EXPERIENCE.md §7.1).
"nightcrawler.experience" = ["playbook.json"]
# The office's concept-art sets (nightcrawler.office; served at /office/art/<name>.jpg) and the 3D town's
# bundled three.js (nightcrawler.office3d; served at /office/assets/<name>.js).
"nightcrawler" = ["office_art/*.jpg", "office_assets/*.js"]

[tool.setuptools.dynamic]
version = { attr = "nightcrawler.__version__" }

[tool.mypy]
# `mypy` (no arguments) checks src/ with these settings; tests/test_typecheck.py keeps it clean.
files = ["src"]
python_version = "3.12"  # the Docker image's Python
ignore_missing_imports = true  # the optional extras may be absent; older requests releases have no hints
check_untyped_defs = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"
markers = [
    "live: opt-in network smoke tests; skipped unless NIGHTCRAWLER_LIVE_TESTS=1",
]
