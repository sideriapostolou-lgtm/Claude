[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytclipper"
version = "0.1.0"
description = "Parse YouTube videos and clip the best moments"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
fetch = ["yt-dlp"]
dev = ["pytest"]

[project.scripts]
ytclipper = "ytclipper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
